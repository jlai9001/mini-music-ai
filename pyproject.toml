[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-music-ai"
version = "0.1.0"
description = "Prototype AI music generation training pipeline"
requires-python = ">=3.12"

dependencies = [
    "torch==2.14.0",
    "transformers==5.16.1",
    "numpy==2.5.3",
    "soundfile",
    "scipy",
]

[project.scripts]
run = "run:main"

[tool.setuptools]
py-modules = [
    "run",
    "audio_length",
    "step1_audio_preparation",
    "step2_audio_encoding",
    "step3_training_sequences",
    "step3B_ending_training_sequences",
    "step4_train_model",
    "step4B_train_ending_model",
    "step5_generate_tokens",
    "step5B_generate_ending",
    "step6_audio_decoding",
]
